<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Monitor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Top Bar -->
        <header class="top-bar">

            <div class="brand">
                <span class="brand-dot"></span>

                <span class="brand-name">
                    ShopWave
                </span>

                <span class="brand-sub">
                    / API monitor
                </span>
            </div>

            <div class="top-right">

                <span class="live">
                    <span class="live-dot"></span>
                    Watching live endpoints
                </span>

                <button class="button" id="add-monitor-button">
                    + Add monitor
                </button>
            </div>

        </header>


        <!-- Add Monitor Form -->
        <section id="add-monitor-form" class="add-monitor-form hidden">

            <h2>Add API Monitor</h2>

            <div id="api-message" class="api-message hidden" role="status"></div>

            <form id="api-form">

                <input
                    type="text"
                    id="api-name"
                    placeholder="API name"
                    required
                >

                <input
                    type="url"
                    id="api-url"
                    placeholder="https://api.example.com"
                    required
                >

                <button type="submit" class="button">
                    Add API
                </button>

                <button
                    type="button"
                    id="cancel-button"
                    class="button"
                >
                    Cancel
                </button>

            </form>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat">
                <div class="stat-label">
                    Total APIs
                </div>

                <div class="stat-value">
                    <span id="total-apis">0</span>
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    Healthy
                </div>

                <div class="stat-value healthy">
                    <span id="healthy-apis">0</span>
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    Down
                </div>

                <div class="stat-value down">
                    <span id="down-apis">0</span>
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    Avg response
                </div>

                <div class="stat-value">
                    <span id="average-response">0</span>
                    <span>ms</span>
                </div>
            </div>

        </section>


        <!-- Monitor Section -->
        <section>

            <div class="section-title">

                <h2>Monitors</h2>

                <span>
                    Click a card to see recent checks
                </span>

            </div>


            <!-- JavaScript puts the cards here -->
            <div id="monitor-list"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
